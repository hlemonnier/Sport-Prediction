[project]
name = "sport-prediction-f1-research-runner"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
deep = ["torch>=2.5"]
fastf1 = ["fastf1>=3.4,<4"]
plots = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
