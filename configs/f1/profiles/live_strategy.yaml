model_family: live_race
profile_name: live_strategy
profile_version: live_strategy_contracts_v6_sporting_deadlines_from_action_timing
source: local_or_fastf1_replay
artifacts:
  report_dir: artifacts/reports/f1
  replay_dir: artifacts/replays/f1/live_strategy
  replay_audit: artifacts/backtests/f1/live_strategy/live_strategy_replay_audit_v1_20260714.json
contracts:
  state_schema: live_strategy_state_v6_full_legal_mask_input_and_feasibility_evidence
  transition_schema: live_strategy_transition_fingerprint_v8_sporting_deadlines_derived_from_action_timing
  replay_record_schema: live_strategy_replay_record_v8_sporting_deadlines_derived_from_action_timing
  legal_mask_schema: live_strategy_legal_action_mask_v3_sporting_deadlines_derived_from_action_timing
  no_leakage:
    state_available_through_lap_required: true
    replay_prefix_invariance_required: true
action_space:
  action_types:
    - stay_out
    - pit_now
    - pit_next_lap
  compounds:
    - SOFT
    - MEDIUM
    - HARD
    - INTERMEDIATE
    - WET
  modes:
    - conservative
    - aggressive
  enforce_dry_mandatory_change: true
  sporting_deadlines_derived_from_action_timing: true
  pit_now_minimum_remaining_laps: 1
  pit_next_lap_minimum_remaining_laps: 2
  known_inventory_requires_reachable_mandatory_compound: true
  terminal_state_has_no_constraint_legal_action: true
  wet_or_intermediate_use_waives_two_dry_specification_rule: true
  missing_tyre_inventory_policy: mask_all_pit_compounds
  missing_pit_lane_state_policy: mask_all_pit_actions
  mandatory_compound_change_override_evidence_required: true
  stay_out_blocked_at_last_feasible_mandatory_stop: true
  constraint_infeasibility_is_all_false_for_policy_training: true
  operational_noop_fallback_is_not_constraint_legal: true
  operational_noop_fallback_executes_with_explicit_penalty: true
evaluation:
  metrics:
    - policy_value
    - illegal_action_rate
    - action_distribution
    - transition_consistency
    - no_leakage_replay_invariance
    - regret_vs_oracle
  fail_closed_on_missing_metrics: true
  historical_diagnostic_evidence:
    artifact: artifacts/reports/f1/live_race_round09_global_prefix_invariance_v2_20260711a.json
    event_key: 202609
    global_cutoff_time_seconds: 5200.0
    prediction_prefix_invariant: true
    matched_rows: 334
    model_one_step_mae_seconds: 0.4207980685382251
    naive_last_lap_mae_seconds: 0.3719550898203593
    implementation_snapshot_status: historical_diagnostic_predates_blend_output_fields
    decision: reject_pure_ssm_point_model_and_keep_strategy_priors_unlocked
planner:
  planner_id: deterministic_dp_pre_sim_v1
  horizon_laps: 12
  discount: 1.0
  strategy_score_weight: 0.05
  transition_model: deterministic_pre_sim_v1
  limitations:
    - single_car_no_traffic_response
    - deterministic_no_random_sc_vsc_sampling
    - pit_loss_and_tyre_degradation_are_hand_tuned_priors
    - position_reward_is_proxy_not_counterfactual_race_order
simulator:
  simulator_id: live_race_simulator_v1
  seed: 7
  transition_terms:
    - event_lap_baseline
    - driver_pace_state
    - tyre_degradation_state
    - compound_effect
    - fuel_proxy
    - traffic_loss
    - track_status_offset
    - weather_offset
    - deterministic_seed_noise
  pit_action:
    applies_track_status_circuit_traffic_pit_loss: true
    resets_tyre_age: true
    resets_degradation_prior: true
  calibration_metrics:
    - one_step_lap_time_mae
    - one_step_lap_time_crps_deterministic_point_forecast
    - pit_loss_mae_when_observed
    - track_status_residuals
    - final_order_proxy_rank_correlation
  limitations:
    - single_car_traffic_and_final_order_are_proxy_only
    - hand_tuned_pace_tyre_pit_loss_priors_until_calibrated
mpc:
  planner_id: simulator_mpc_v1
  transition_model: live_race_simulator_v1
  horizon_laps: 5
  branch_limit: 8
  max_sequences: 512
  utility:
    race_time_weight: 1.0
    expected_points_weight: 0.0
    downside_cvar_weight: 0.15
    illegal_action_penalty_weight: 1.0
    cvar_alpha: 0.20
  scenarios:
    - monaco_low_overtake
    - high_overtake
    - wet
    - sc_vsc
  diagnostics:
    points_and_final_order_are_proxy_only: true
    require_legal_action_sequences: true
rl:
  phase: phase_7_behavior_cloning_offline_rl
  replay_dataset:
    dataset_id: live_strategy_rl_replay_v8_sporting_deadlines_derived_from_action_timing
    source_contract: StrategyTransition
    action_index: shared_live_strategy_action_space
    offline_q_legal_masks_required: true
    ood_flags_required: true
    behavior_cloning_eligibility:
      causal_physical_action_family_label_required: true
      unobserved_pace_mode_target: partial_label_over_both_modes
      certified_full_legal_action_mask_required: false
      logged_behavior_propensity_required: false
    offline_q_eligibility:
      exact_observed_pace_mode_required: true
      certified_current_full_legal_action_mask_required: true
      certified_nonterminal_next_state_full_legal_action_mask_required: true
      current_and_next_mask_payloads_must_match_derived_masks: true
      next_state_mask_fingerprint_must_match_derived_mask: true
      legality_driving_inputs_required_for_current_and_nonterminal_next_state:
        - race_horizon
        - current_compound
        - full_used_compound_history
        - red_flag_status
        - box_lap_status
        - pit_lane_status
        - nonempty_available_compound_inventory
        - explicit_forced_pit_commitment_including_known_none
        - mandatory_compound_change_requirement_known_or_certified_derived
        - constraint_legal_mask_feasible_without_operational_fallback
      infeasible_constraint_mask_is_policy_or_ope_eligible: false
      logged_action_must_be_causal_known_and_legal: true
      logged_behavior_propensity_required: false
    propensity_ope_eligibility:
      numeric_logged_behavior_propensity_required: true
      nonzero_logged_action_support_required: true
    pit_action_offline_q_requirements:
      known_pit_lane_status: true
      known_compound_inventory: true
    current_replay_readiness:
      evidence: artifacts/backtests/f1/live_strategy/live_strategy_replay_audit_v1_20260714.json
      transitions: 9506
      behavior_cloning_partial_label_rows: 9506
      behavior_cloning_action_families_supported: 4
      behavior_cloning_compatible_action_keys: 8
      exact_mode_action_keys_supported: 0
      offline_q_rows: 0
      propensity_ope_rows: 0
      strategy_training_readiness_gate_pass: false
    reward_clip:
      min: -500.0
      max: 100.0
  behavior_cloning:
    model_id: masked_behavior_cloning_partial_label_warm_start_v2
    target: observed_team_action_family_with_unobserved_pace_mode
    bucket_precision: 2
    smoothing: 0.25
    role: warm_start_only
    promotion_allowed: false
    required_diagnostics:
      - action_selection_accuracy
      - pit_decision_f1
      - pit_timing_lap_mae
      - delta_vs_trivial_baseline
  offline_rl:
    model_id: live_strategy_conservative_offline_q_v1
    algorithm: conservative_fitted_q_iteration
    dependency_policy: numpy_only
    bucket_precision: 2
    iterations: 60
    learning_rate: 0.30
    # Replay rewards are interval-total elapsed-time costs. Multi-lap SMDP
    # transitions therefore require gamma=1 until per-lap rewards are stored.
    discount: 1.0
    reward_semantics: undiscounted_interval_total_composite_reward_negative_elapsed_time_plus_position_gain_shaping_minus_action_penalties
    race_time_weight: 1.0
    position_gain_weight: 2.0
    conservative_penalty: 0.40
    ood_action_penalty: 8.0
    value_clip:
      min: -800.0
      max: 200.0
    legal_masks_required: true
    locked_simulator_evaluation_required: true
    historical_accuracy_promotion_allowed: false
    comparisons:
      - behavior_cloning
      - dp_mpc
coordination:
  model_id: centralized_pit_schedule_search_v1
  algorithm: deterministic_schedule_enumeration
  reinforcement_learning: false
  policy_gradient: false
  centralized_search: true
  decentralized_masked_execution: true
  role: experimental_multi_car_coordination_baseline
  promotion_allowed: false
