name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  backend:
    name: Backend check (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static check
        run: bun run check

  python_smoke:
    name: Python syntax smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: |
          python -m compileall research/sport_cli.py
          python -m compileall "research/projects/F1/rising_qualification_prediction/Python"
          python -m compileall "research/projects/Football/Match Result Prediction/Python"

  f1_tests:
    name: F1 pytest suite (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: review-core
            tests: >-
              tests/test_gpt_pro_review_fixes.py
              tests/test_listwise_probabilities.py
              tests/test_baseline_ladder.py
          - name: betting-circuit
            tests: >-
              tests/test_betting_system.py
              tests/test_circuit_cards.py
          - name: live-horizon
            tests: >-
              tests/test_live_horizon_b.py
              tests/test_horizon_a_vs_b_lap_snapshots.py
          - name: fallback-weights
            tests: >-
              tests/test_heuristic_fallback.py
              tests/test_rolling_weights.py
    defaults:
      run:
        working-directory: research/projects/F1/rising_qualification_prediction/Python
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy scikit-learn requests

      - name: Run test shard
        timeout-minutes: 10
        run: python -m pytest -q --durations=20 ${{ matrix.shard.tests }}

  live_frontier_integration:
    name: Frozen lap-time model and API integration
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: .:research/projects/F1/rising_qualification_prediction/Python:services/f1-platform:services/f1-prediction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: python -m pip install pytest numpy pandas scikit-learn requests fastapi httpx
      - name: Verify packaged model, causal inputs, fallback and API transport
        run: >-
          python -m pytest -q --import-mode=importlib
          research/projects/F1/rising_qualification_prediction/Python/tests/test_live_next_lap_frontier.py
          services/f1-platform/tests/test_frontier_integration.py
          services/f1-prediction-service/tests/test_model.py
