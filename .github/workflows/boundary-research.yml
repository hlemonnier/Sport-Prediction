name: Boundary research contracts

on:
  push:
    paths:
      - "research/experiments/boundary_20260908/**"
      - "research/experiments/performance_20260907/**"
      - "research/experiments/frontier_20260907/**"
      - "packages/football/**"
      - "packages/sports_core/**"
      - ".github/workflows/boundary-research.yml"
  pull_request:
    paths:
      - "research/experiments/boundary_20260908/**"
      - "research/experiments/performance_20260907/**"
      - "research/experiments/frontier_20260907/**"
      - "packages/football/**"
      - "packages/sports_core/**"
      - ".github/workflows/boundary-research.yml"

permissions:
  contents: read

concurrency:
  group: boundary-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Forecast mathematics and causal data contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research test dependencies
        run: python -m pip install pytest numpy pandas scipy scikit-learn requests catboost==1.2.10
      - name: Verify model mathematics and causal stream contracts
        # The two optional exact-pilot replay tests skip without the local raw
        # archives. Synthetic contracts need no provider access or historical fits.
        run: >-
          python -m pytest -q --import-mode=importlib -p no:cacheprovider
          research/experiments/boundary_20260908/football_xg/ci_contracts
          research/experiments/boundary_20260908/football_xg/execution/test_run.py
          research/experiments/boundary_20260908/sector_pilot
          research/experiments/boundary_20260908/sector_forecast
          research/experiments/boundary_20260908/telemetry_pilot
          research/experiments/boundary_20260908/football_information
          research/experiments/boundary_20260908/telemetry/test_acquire.py
          research/experiments/boundary_20260908/telemetry/test_features.py
          research/experiments/boundary_20260908/telemetry/test_data.py
          research/experiments/boundary_20260908/telemetry/test_models.py
          research/experiments/boundary_20260908/telemetry/test_evaluate.py
          research/experiments/boundary_20260908/telemetry/test_run.py
          research/experiments/boundary_20260908/telemetry_verification_v2/test_verify.py
          research/experiments/boundary_20260908/rival_gap_pilot
          research/experiments/boundary_20260908/rival_gap_pilot_v2
          research/experiments/boundary_20260908/rival_gap_forecast
          research/experiments/boundary_20260908/catboost_frontier
          research/experiments/boundary_20260908/football_past_market
          research/experiments/boundary_20260908/football_elo_followup
          research/experiments/boundary_20260908/football_deployment_policy
          research/experiments/boundary_20260908/football_deployment_replay_v2
          research/experiments/boundary_20260908/football/test_math.py
          packages/football/tests/test_deployment.py
          packages/football/tests/test_default_deployment.py
          research/experiments/boundary_20260908/rival_gap_verification/test_prefix.py
          research/experiments/boundary_20260908/rival_gap_verification/test_cross_implementation.py
          research/experiments/boundary_20260908/telemetry_sequence_publication

  sequence-contracts:
    name: Causal telemetry sequence contracts (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install research test dependencies
        run: python -m pip install pytest numpy pandas scipy scikit-learn requests
      - name: Verify causal sequence and independent replay contracts
        # Synthetic fixtures only: no provider downloads, historical corpus,
        # pretrained assets, or historical model fitting are required.
        run: >-
          python -m pytest -q --import-mode=importlib -p no:cacheprovider
          research/experiments/boundary_20260908/telemetry_sequence
          research/experiments/boundary_20260908/telemetry_sequence_verification
