[project]
name = "sport-prediction-f1-research-runner"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
deep = ["torch>=2.5"]
fastf1 = ["fastf1>=3.4,<4"]
fia = ["pypdf>=6,<7"]
optional-models = ["lightgbm>=4.6,<5", "xgboost>=3.3,<4"]
plots = ["matplotlib>=3.8,<4"]
notebooks = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]
test = ["pytest>=8,<9", "pypdf>=6,<7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
