{
  "profile_version": 2,
  "name": "live_2026_prequal",
  "mission": "live_ops",
  "workflow": "weekend_phase",
  "defaults": {
    "phase": "pre-qualifying",
    "source": "local",
    "year": 2026,
    "round_number": 1,
    "include_standings": false,
    "weekends_dir": "data/f1/raw/weekends",
    "cache_dir": null
  },
  "training": {
    "train_seasons": [2026],
    "historical_transfer_enabled": false
  },
  "experiments": {
    "enable_dl_candidates": false,
    "compare_families": ["baseline"]
  },
  "dl": {
    "device": "auto",
    "arch": "mlp_tabular_v1",
    "seed": 42,
    "hyperparams": {
      "hidden_dims": [128, 64],
      "dropout": 0.15,
      "lr": 0.001,
      "weight_decay": 0.0001,
      "epochs": 300,
      "batch_size": 64,
      "early_stopping_patience": 25
    }
  },
  "f1": {
    "mode": "offline",
    "live": {
      "source": "auto",
      "model": "ssm_v1",
      "horizon_laps": 10,
      "next_lap_ssm_weight": 0.00,
      "seed": 42,
      "cache_dir": null,
      "replay_path": null
    }
  },
  "evaluation": {
    "gates": {
      "block_stability_enabled": true,
      "min_mae_gain": 0.03,
      "min_top10_gain": 0.005
    }
  },
  "artifacts": {
    "base_dir": "artifacts/predictions/f1/live"
  }
}
